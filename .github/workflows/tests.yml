# Runs every test suite on each push and pull request, on Windows, where the
# product runs. The tests use the fake provider and fixtures: no secret, no
# settings file and no network access to a provider are needed.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Backend, launcher and release tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install the pinned requirements
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Backend tests
        working-directory: backend
        run: python -m pytest -q

      - name: Launcher and release tests
        run: python -m pytest launcher release

  frontend:
    name: Frontend tests and type check
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install from the lockfile
        run: npm ci

      - name: Frontend tests
        run: npm run test

      - name: Type check
        run: npx tsc -b
