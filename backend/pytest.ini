[pytest]
DJANGO_SETTINGS_MODULE = cardfactory.settings
# pythonpath is applied before -p plugins are imported, and both happen before
# pytest-django loads the settings, so tests.isolation sets the home in time.
pythonpath = .
addopts = -p tests.isolation -p tests.network_guard
python_files = test_*.py
python_classes = Test*
python_functions = test_*
norecursedirs = .* __pycache__ node_modules data runtime
